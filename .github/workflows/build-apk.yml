name: Android APK 자동 빌드 및 릴리스

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Go 최신 안정 버전 설정
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Go 모듈 및 빌드 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-tsnet-${{ hashFiles('tsnet-bridge/go.mod', 'tsnet-bridge/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-tsnet-

      - name: Android SDK 라이선스 동의 및 NDK 경로 확인
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

          NDK_DIR=""
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            NDK_DIR="${ANDROID_NDK_LATEST_HOME}"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "${ANDROID_NDK_HOME}" ]; then
            NDK_DIR="${ANDROID_NDK_HOME}"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ] && [ -d "${ANDROID_NDK_ROOT}" ]; then
            NDK_DIR="${ANDROID_NDK_ROOT}"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/ndk" ]; then
            NDK_DIR="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi

          if [ -z "$NDK_DIR" ]; then
            echo "사전 설치된 NDK를 찾지 못해 sdkmanager로 NDK를 설치합니다."
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_DIR="${ANDROID_HOME}/ndk/27.2.12479018"
          fi

          echo "사용할 Android NDK 경로: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: gomobile로 내장 Tailscale(tsnet) AAR 빌드 (arm64)
        shell: bash
        env:
          GOTOOLCHAIN: auto
          # Android 15+ 16KB 메모리 페이지 기기 호환용 ELF 정렬 플래그
          CGO_LDFLAGS: "-Wl,-z,max-page-size=16384"
        run: |
          mkdir -p app/libs
          cd tsnet-bridge
          go get tailscale.com/tsnet@latest
          go mod tidy
          # go mod tidy 이후 gomobile bind가 요구하는 바인딩 런타임 패키지를 명시적으로 유지
          go get golang.org/x/mobile/bind@latest

          # tsnet-bridge와 동일한 Go 툴체인으로 gomobile/gobind 설치 및 초기화
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

          gomobile bind -v -target=android/arm64 -androidapi 29 -javapkg=com.unraid.app -o ../app/libs/tsnetbridge.aar .
          ls -lh ../app/libs/tsnetbridge.aar

      - name: Gradle 8.11.1 설정 (Wrapper 바이너리 불필요)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK 빌드 (서명 키 유무에 따라 Release / Debug 자동 분기)
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          APP_VERSION="1.0.0"
          BUILD_NUM="${GITHUB_RUN_NUMBER}"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "서명 키(Secrets)가 감지되었습니다. 서명된 Release APK를 빌드합니다."
            KEYSTORE_FILE="${RUNNER_TEMP}/release-keystore.jks"
            # certutil 헤더/푸터 및 공백/개행이 섞여 있어도 안전하게 Base64 디코딩
            printf '%s' "$KEYSTORE_BASE64" | grep -v '^-----' | tr -d '\n\r ' | base64 --decode > "$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"

            # Gradle 실행 전 키스토어 파일 및 비밀번호 유효성 사전 점검
            CLEAN_STORE_PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "${CLEAN_STORE_PASS}" > /dev/null 2>&1; then
              echo "::error::키스토어 비밀번호(KEYSTORE_PASSWORD)가 일치하지 않거나 KEYSTORE_BASE64 값이 손상되었습니다. GitHub Secrets의 KEYSTORE_PASSWORD와 KEYSTORE_BASE64를 다시 확인해 주세요."
              rm -f "$KEYSTORE_FILE"
              exit 1
            fi

            gradle assembleRelease --stacktrace

            APK_PATH="release-output/unraid-hub-v${APP_VERSION}-b${BUILD_NUM}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
            rm -f "$KEYSTORE_FILE"

            echo "build_type=Release" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "release_note=서명된 **Release APK** 빌드입니다. (내장 Tailscale tsnet arm64 포함)" >> "$GITHUB_OUTPUT"
          else
            echo "서명 키(Secrets)가 설정되지 않았습니다. 즉시 설치 가능한 Debug APK를 빌드합니다."
            gradle assembleDebug --stacktrace

            APK_PATH="release-output/unraid-hub-v${APP_VERSION}-b${BUILD_NUM}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_PATH"

            echo "build_type=Debug" >> "$GITHUB_OUTPUT"
            echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
            echo "release_note=서명 키(Secrets) 미등록 상태이므로 **Debug APK**로 자동 빌드되었습니다. (내장 Tailscale tsnet arm64 포함)" >> "$GITHUB_OUTPUT"
          fi

      - name: 빌드 산출물 아티팩트 백업 업로드
        uses: actions/upload-artifact@v4
        with:
          name: unraid-hub-apk-${{ steps.build.outputs.build_type }}-b${{ github.run_number }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

      - name: GitHub Releases 자동 생성 및 APK 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: Unraid Hub v1.0.0 (Build #${{ github.run_number }} - ${{ steps.build.outputs.build_type }})
          body: |
            ## Unraid Hub 자동 빌드 결과
            - **빌드 타입:** ${{ steps.build.outputs.build_type }}
            - **빌드 번호:** #${{ github.run_number }}
            - **커밋:** `${{ github.sha }}`

            ${{ steps.build.outputs.release_note }}
            아래 **Assets**에서 `.apk` 파일을 다운로드하여 안드로이드 기기에 설치하세요.
          files: ${{ steps.build.outputs.apk_path }}
          draft: false
          prerelease: false
